name: Inspect and Repack XHYN APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct APK URL
        required: true
        type: string
        default: https://tmpfiles.org/dl/1790880498.08dfc23730a4071d/wuAUAemmwhea/xhyn-v-final.apk

jobs:
  inspect-and-repack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download APK
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "${{ inputs.apk_url }}" -o input.apk
          test -s input.apk
          sha256sum input.apk

      - name: Install Android tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip zipalign apksigner file binutils

      - name: Extract APK
        run: |
          set -euo pipefail
          rm -rf apk
          mkdir apk
          unzip -q input.apk -d apk
          echo "=== Native libraries ==="
          find apk -type f -name '*.so' -print | sort
          echo "=== APK top-level ==="
          find apk -maxdepth 2 -type f | sort | head -250

      - name: Inspect Mali DXVK paths
        run: |
          set -euo pipefail
          mkdir -p report
          {
            echo "=== APK hash ==="
            sha256sum input.apk
            echo
            echo "=== Relevant native strings ==="
            find apk -type f -name '*.so' -print0 | while IFS= read -r -d '' f; do
              echo "--- $f ---"
              strings -a "$f" | grep -Ei 'fillModeNonSolid|extendedDynamicState3PolygonMode|No adapters found|Vulkan 1.3|Adreno|KGSL|libgtavvk|dxvk|custom driver|Mali-G720' | head -150 || true
            done
            echo
            echo "=== Config candidates ==="
            find apk -type f \( -iname '*.json' -o -iname '*.conf' -o -iname '*.ini' -o -iname '*.toml' \) -print0 | while IFS= read -r -d '' f; do
              if grep -IlEi 'fillModeNonSolid|dxvk|vulkan|Adreno|KGSL|custom driver' "$f" >/dev/null 2>&1; then
                echo "MATCH: $f"
                grep -Ein 'fillModeNonSolid|dxvk|vulkan|Adreno|KGSL|custom driver' "$f" | head -100 || true
              fi
            done
          } | tee report/inspection.txt

      - name: Apply only verified textual requirement patch
        run: |
          set -euo pipefail
          rm -rf patched
          cp -a apk patched
          changed=0
          while IFS= read -r -d '' f; do
            if grep -q 'fillModeNonSolid' "$f" 2>/dev/null; then
              cp "$f" "$f.bak"
              sed -i -E 's/("fillModeNonSolid"[[:space:]]*:[[:space:]]*)true/\1false/g' "$f"
              if ! cmp -s "$f" "$f.bak"; then changed=1; fi
              rm -f "$f.bak"
            fi
          done < <(find patched -type f -name '*.json' -print0)
          echo "textual_fillModeNonSolid_patch=$changed" | tee report/patch.txt
          if [ "$changed" -eq 0 ]; then
            echo "No textual fillModeNonSolid requirement found. Native .so binaries were NOT modified." | tee -a report/patch.txt
          fi

      - name: Repack, align and sign
        run: |
          set -euo pipefail
          rm -f rebuilt-unsigned.apk rebuilt-aligned.apk rebuilt.apk
          (cd patched && zip -q -r9 ../rebuilt-unsigned.apk .)
          zipalign -f 4 rebuilt-unsigned.apk rebuilt-aligned.apk
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android             -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android             --out rebuilt.apk rebuilt-aligned.apk
          apksigner verify --verbose rebuilt.apk
          sha256sum rebuilt.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xhyn-apk-inspection-and-repack
          path: |
            input.apk
            rebuilt.apk
            report/inspection.txt
            report/patch.txt
          retention-days: 7
