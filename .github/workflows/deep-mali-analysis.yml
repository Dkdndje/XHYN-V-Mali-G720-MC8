name: Deep Mali DXVK Binary Analysis

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: GoFile share URL or direct APK URL
        required: true
        type: string
        default: https://gofile.io/d/X1eTDcNP

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and download APK
        env:
          SOURCE_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          rm -rf apk report
          mkdir -p apk report
          url="$SOURCE_URL"

          if [[ "$url" == https://gofile.io/d/* ]]; then
            code="${url##*/}"
            ua='Mozilla/5.0'
            lang='en-US'
            acct="$(curl -fsSL -A "$ua" -X POST https://api.gofile.io/accounts)"
            token="$(printf '%s' "$acct" | jq -r '.data.token')"
            test -n "$token" && test "$token" != null

            bucket="$(( $(date +%s) / 14400 ))"
            wt="$(printf '%s::%s::%s::%s::5d4f7g8sd45fsd' "$ua" "$lang" "$token" "$bucket" | sha256sum | cut -d' ' -f1)"

            meta="$(curl -fsSL -A "$ua" --get "https://api.gofile.io/contents/$code"               -H "Authorization: Bearer $token"               -H "X-Website-Token: $wt"               -H "X-BL: $lang"               --data-urlencode "cache=true")"

            url="$(printf '%s' "$meta" | jq -r '.data.children[]? | select(.name=="XHYN-V-final.apk") | (.link // .directLink)' | head -n1)"
            test -n "$url" && test "$url" != null
          fi

          echo "Resolved source: $url"
          curl -L --fail --retry 5 --retry-delay 3 -A 'Mozilla/5.0' "$url" -o input.apk
          file input.apk
          test "$(stat -c%s input.apk)" -gt 1000000
          unzip -tq input.apk
          unzip -q input.apk -d apk
          test -d apk/lib/arm64-v8a
          find apk/lib/arm64-v8a -type f -name '*.so' -print | sort | tee report/arm64-libs.txt

      - name: Install analysis tools
        run: python3 -m pip install --break-system-packages pyelftools capstone

      - name: Scan native libraries
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            strings -a "$f" | grep -E 'fillModeNonSolid|extendedDynamicState3PolygonMode|No adapters found|Vulkan 1.3|Adreno|KGSL|libgtavvk|DXVK' || true
          done < report/arm64-libs.txt | tee report/relevant-strings.txt

      - name: Locate fillModeNonSolid references
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee report/fillmode-search.txt
          import os
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN
          needle=b"fillModeNonSolid"
          md=Cs(CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN)
          for root,_,files in os.walk("apk/lib/arm64-v8a"):
              for fn in files:
                  if not fn.endswith(".so"): continue
                  p=os.path.join(root,fn)
                  b=open(p,"rb").read()
                  pos=0
                  while True:
                      i=b.find(needle,pos)
                      if i<0: break
                      print(f"{p}: string_offset=0x{i:x}")
                      pos=i+1
          PY

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: xhyn-deep-mali-analysis
          path: |
            input.apk
            report/
          retention-days: 7
