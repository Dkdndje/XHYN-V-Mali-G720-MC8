name: Deep Mali DXVK Binary Analysis

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct APK URL
        required: true
        type: string
        default: https://store3.gofile.io/download/web/84987b15-395f-4656-bc5c-5e16d691af3c/XHYN-V-final.apk

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Download and validate APK
        run: |
          set -euo pipefail
          rm -rf apk report
          mkdir -p apk report
          curl -L --fail --retry 5 --retry-delay 3 -A 'Mozilla/5.0' "${{ inputs.apk_url }}" -o input.apk
          file input.apk
          test "$(stat -c%s input.apk)" -gt 1000000
          unzip -tq input.apk
          unzip -q input.apk -d apk
          test -d apk/lib/arm64-v8a
          find apk/lib/arm64-v8a -type f -name '*.so' -print | sort | tee report/arm64-libs.txt

      - name: Install analysis tools
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages pyelftools capstone

      - name: Scan native libraries
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            strings -a "$f" | grep -E 'fillModeNonSolid|extendedDynamicState3PolygonMode|No adapters found|Vulkan 1.3|Adreno|KGSL|libgtavvk|DXVK' || true
          done < report/arm64-libs.txt | tee report/relevant-strings.txt

      - name: Locate fillModeNonSolid references
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee report/fillmode-search.txt
          import os
          needle=b"fillModeNonSolid"
          for root,_,files in os.walk("apk/lib/arm64-v8a"):
              for fn in files:
                  if fn.endswith(".so"):
                      p=os.path.join(root,fn)
                      b=open(p,"rb").read()
                      hits=[]
                      pos=0
                      while True:
                          i=b.find(needle,pos)
                          if i<0: break
                          hits.append(hex(i)); pos=i+1
                      if hits: print(p, "offsets=", ",".join(hits))
          PY

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: xhyn-deep-mali-analysis
          path: |
            input.apk
            report/
          retention-days: 7
