name: Deep Mali DXVK Binary Analysis

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: GoFile share URL or direct APK URL
        required: true
        type: string
        default: https://gofile.io/d/X1eTDcNP

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and download APK
        env:
          SOURCE_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          rm -rf apk report
          mkdir -p apk report
          url="$SOURCE_URL"
          if [[ "$url" == https://gofile.io/d/* ]]; then
            code="${url##*/}"
            acct="$(curl -fsSL -A 'Mozilla/5.0' https://api.gofile.io/createAccount)"
            token="$(printf '%s' "$acct" | jq -r '.data.token')"
            test -n "$token" && test "$token" != null
            meta="$(curl -fsSL -A 'Mozilla/5.0' --get https://api.gofile.io/getContent               --data-urlencode "contentId=$code"               --data-urlencode "token=$token"               --data-urlencode "websiteToken=12345"               --data-urlencode "cache=true")"
            url="$(printf '%s' "$meta" | jq -r '.data.contents | to_entries[] | select(.value.name=="XHYN-V-final.apk") | .value.directLink // .value.link' | head -n1)"
            test -n "$url" && test "$url" != null
          fi
          echo "Resolved source: $url"
          curl -L --fail --retry 5 --retry-delay 3 -A 'Mozilla/5.0' "$url" -o input.apk
          file input.apk
          test "$(stat -c%s input.apk)" -gt 1000000
          unzip -tq input.apk
          unzip -q input.apk -d apk
          test -d apk/lib/arm64-v8a
          find apk/lib/arm64-v8a -type f -name '*.so' -print | sort | tee report/arm64-libs.txt

      - name: Install analysis tools
        run: python3 -m pip install --break-system-packages pyelftools capstone

      - name: Scan native libraries
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            strings -a "$f" | grep -E 'fillModeNonSolid|extendedDynamicState3PolygonMode|No adapters found|Vulkan 1.3|Adreno|KGSL|libgtavvk|DXVK' || true
          done < report/arm64-libs.txt | tee report/relevant-strings.txt

      - name: Locate fillModeNonSolid references
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee report/fillmode-search.txt
          import os
          needle=b"fillModeNonSolid"
          for root,_,files in os.walk("apk/lib/arm64-v8a"):
              for fn in files:
                  if fn.endswith(".so"):
                      p=os.path.join(root,fn); b=open(p,"rb").read(); hits=[]; pos=0
                      while True:
                          i=b.find(needle,pos)
                          if i<0: break
                          hits.append(hex(i)); pos=i+1
                      if hits: print(p, "offsets=", ",".join(hits))
          PY

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: xhyn-deep-mali-analysis
          path: |
            input.apk
            report/
          retention-days: 7
